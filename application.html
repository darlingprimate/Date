<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Darling Primate — Application</title>
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="application">
<a href="#main" class="skip-link">Skip to content</a>

<nav class="dp-nav" aria-label="Primary">
  <div class="dp-nav__inner">
    <a href="index.html" class="dp-brand" style="text-decoration:none;">
      <img src="assets/primate.jpg" alt="Darling Primate" class="dp-brand__photo" />
      <span><span class="dp-brand__heart">♥</span> Darling Primate</span>
    </a>
    <div class="dp-nav__right">
      <span class="dp-tag" data-i18n="nav.tag">PRIVATE • ROMANTIC • OFFICIAL</span>
      <div class="lang-select-wrap">
        <select id="langSelect" class="lang-select" aria-label="Choose your language">
          <option value="en">English</option>
          <option value="bn">বাংলা</option>
          <option value="hi">हिन्दी</option>
          <option value="ur">اردو</option>
          <option value="ar">العربية</option>
          <option value="tr">Türkçe</option>

      </div>
    </div>
  </div>

<main id="main" class="fit-viewport">

    <div class="progress-wrap">
